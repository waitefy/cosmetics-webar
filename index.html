<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Карточка учебной помады «Мягкий цвет» с выбором оттенка.">
    <title>Помада «Мягкий цвет»</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="product">
      <div class="product-image">
        <div class="product-scene">
          <img id="product-poster" class="product-poster" src="/src/assets/lipstick-s001.webp" width="800" height="800" alt="Открытая помада «Мягкий цвет»">
          <div id="product-model" class="product-model" hidden></div>
        </div>
        <button type="button" id="model-toggle" class="model-switch" aria-label="Посмотреть в 3D" aria-controls="product-model" aria-expanded="false">3D</button>
        <p id="model-status" class="model-status" role="status"></p>
      </div>
      <section class="product-details" aria-labelledby="product-title">
        <p class="collection">Учебная коллекция</p>
        <h1 id="product-title">Помада<br>«Мягкий цвет»</h1>
        <fieldset class="palette">
          <legend>Выберите оттенок</legend>
          <div id="shade-options" class="shade-options"></div>
        </fieldset>
      </section>
    </main>
  </body>
</html>
